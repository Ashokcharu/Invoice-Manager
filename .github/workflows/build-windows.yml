name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Create Windows EXE icon from PNG
        shell: pwsh
        run: |
          python -c "from PIL import Image; image=Image.open('data/icon.png').convert('RGBA'); side=max(image.size); canvas=Image.new('RGBA',(side,side),(0,0,0,0)); canvas.alpha_composite(image,((side-image.width)//2,(side-image.height)//2)); canvas.save('app_build.ico',format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build EXE
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name AdoodsInvoice `
            --icon app_build.ico `
            --add-data "data/C GST.xlsx;data" `
            --add-data "data/I GST.xlsx;data" `
            --add-data "data/icon.png;data" `
            main.py

      - name: Prepare PDF output folders
        shell: pwsh
        run: |
          $year = Get-Date -Format "yyyy"
          $month = Get-Date -Format "MMMM"
          $folders = @(
            "dist/AdoodsInvoice/_internal/data/workbooks",
            "dist/AdoodsInvoice/_internal/invoices/Invoices/PDF",
            "dist/AdoodsInvoice/_internal/invoices/Private/Invoices/PDF",
            "dist/AdoodsInvoice/_internal/invoices/Quotations/PDF",
            "dist/AdoodsInvoice/_internal/invoices/Invoices/XLSX",
            "dist/AdoodsInvoice/_internal/invoices/Private/Invoices/XLSX",
            "dist/AdoodsInvoice/_internal/invoices/Quotations/XLSX",
            "dist/AdoodsInvoice/_internal/invoices/QR",
            "dist/AdoodsInvoice/invoices/Invoices_PDF_$year/$month",
            "dist/AdoodsInvoice/invoices/Private_PDF_$year/$month",
            "dist/AdoodsInvoice/invoices/Quotation_PDF_$year/$month"
          )
          foreach ($folder in $folders) {
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
          }

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: ADInvoice-Windows
          path: dist/AdoodsInvoice/
