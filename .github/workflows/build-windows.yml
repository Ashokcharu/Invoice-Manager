name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name AdoodsInvoice `
            --icon app.ico `
            --add-data "app.ico;." `
            --add-data "data/C GST.xlsx;data" `
            --add-data "data/I GST.xlsx;data" `
            main.py

      - name: Prepare PDF output folders
        shell: pwsh
        run: |
          $year = Get-Date -Format "yyyy"
          $month = Get-Date -Format "MMMM"
          $folders = @(
            "dist/AdoodsInvoice/invoices/Invoices_PDF_$year/$month",
            "dist/AdoodsInvoice/invoices/Private_PDF_$year/$month",
            "dist/AdoodsInvoice/invoices/Quotation_PDF_$year/$month"
          )
          foreach ($folder in $folders) {
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
          }

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: ADInvoice-Windows
          path: dist/AdoodsInvoice/
